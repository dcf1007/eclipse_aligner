name: Apply horizon toggle patch

on:
  push:
    branches:
      - debug/preview-horizon-multiarc
    paths:
      - .horizon_toggle.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .horizon_toggle.patch
          python - <<'PY'
          from pathlib import Path
          source = Path('circle_arc_detector.py').read_text()
          compile(source, 'circle_arc_detector.py', 'exec')
          PY
          expected='9b093cf45e2c9692c8784e9319878c767b8e37f7'
          actual="$(git hash-object circle_arc_detector.py)"
          test "$actual" = "$expected"
      - name: Commit source and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle_arc_detector.py
          git rm .horizon_toggle.patch .github/workflows/apply_horizon_toggle.yml
          git commit -m 'Add user override for detected horizon'
          git push origin HEAD:debug/preview-horizon-multiarc
