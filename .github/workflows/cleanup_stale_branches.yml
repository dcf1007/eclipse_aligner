name: Cleanup stale branches
on:
  push:
    branches:
      - main
    paths:
      - .cleanup-stale-branches-trigger
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete stale branch refs
        run: |
          set -euo pipefail
          for branch in \
            chatgpt-color-preview-staging \
            chatgpt-multifile-staging \
            debug/preview-horizon-multiarc \
            noop-temp-ignore \
            noop-temp-ignore-2 \
            noop-temp-ignore-3 \
            noop-temp-ignore-4 \
            noop-temp-ignore-5
          do
            git push origin --delete "$branch"
          done
      - name: Remove cleanup scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .cleanup-stale-branches-trigger
          rm -f .github/workflows/cleanup_stale_branches.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'Remove stale-branch cleanup scaffolding'
          git push origin HEAD:main
