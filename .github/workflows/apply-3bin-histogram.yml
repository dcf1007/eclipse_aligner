name: Validate and apply 3-bin histogram peak signal

on:
  push:
    branches:
      - rebuild/threshold_finder

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/threshold_finder
          fetch-depth: 0

      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          python -m pip install --quiet pytest numpy opencv-python-headless

      - name: Apply exact tested 3-bin integration
        run: python snippets/apply_histogram_3bin_to_production.py

      - name: Compile production source
        run: python -m py_compile circle_arc_detector.py

      - name: Run repository tests
        run: python -m pytest -q tests

      - name: Verify only intended histogram implementation changed
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('circle_arc_detector.py').read_text(encoding='utf-8')
          assert 'PEAK_KERNEL = np.array([0.25, 0.50, 0.25], dtype=np.float64)' in text
          assert 'HISTOGRAM_SIGMA' not in text
          assert '_gaussian_kernel_1d' not in text
          assert 'def local_peak_signal(' in text
          assert 'ROI_DILATION_FRACTION = 0.065' in text
          assert 'GUARD_DILATION_FRACTION = 0.195' in text
          assert 'WORK_MAX_DIM = 1200' in text
          assert 'cv2.CMP_GT' in text
          PY

      - name: Commit production change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-3bin-histogram.yml
          git add circle_arc_detector.py snippets/apply_histogram_3bin_to_production.py tests/test_histogram_peak_3bin.py
          git commit -m "Use 3-bin histogram peak smoothing"
          git push origin HEAD:rebuild/threshold_finder
