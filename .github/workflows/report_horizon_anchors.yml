name: Report horizon patch anchors

on:
  push:
    branches:
      - debug/preview-horizon-multiarc

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('circle_arc_detector.py').read_text()
          probes={
            'visible_signature':'def visible_fraction(mask, candidate, exclude=None):',
            'seed_comment':'# Seed bins identify the physical boundary that started the growth.',
            'coverage_vars':'    total_bins = 0\n    largest_bins = 0',
            'fallback':'    fallback = None\n    if (\n        axes_in_range(seed, min_radius, max_radius)',
            'visible_call':'            fraction, visible_pixels = visible_fraction(light_mask, candidate, dark)',
          }
          lines=[]
          for name,probe in probes.items():
              lines.append(f'{name}={s.count(probe)}')
          Path('.anchor_report.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .anchor_report.txt
          git commit -m 'Report horizon patch anchors' || exit 0
          git push origin HEAD:debug/preview-horizon-multiarc
