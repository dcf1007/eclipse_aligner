name: Apply horizon logic only

on:
  push:
    branches:
      - debug/preview-horizon-multiarc

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('circle_arc_detector.py')
          s=p.read_text()

          a='''def visible_fraction(mask, candidate, exclude=None):
    height, width = mask.shape
    x0, y0, x1, y1 = ellipse_bounds(candidate, width, height)
    if x0 >= x1 or y0 >= y1:
        return 0.0, 0

    yy, xx = np.ogrid[y0:y1, x0:x1]
    valid = ellipse_inside(xx, yy, candidate)
    if exclude is not None:
        valid &= ~ellipse_inside(xx, yy, exclude)

    visible_pixels = int(np.count_nonzero(valid))
    if visible_pixels == 0:
        return 0.0, 0
    matching = int(np.count_nonzero(mask[y0:y1, x0:x1][valid]))
    return matching / visible_pixels, visible_pixels
'''
          b='''def visible_fraction(mask, candidate, exclude=None, horizon=None):
    """Measure mask occupancy only in the physically visible candidate area."""
    height, width = mask.shape
    x0, y0, x1, y1 = ellipse_bounds(candidate, width, height)
    if x0 >= x1 or y0 >= y1:
        return 0.0, 0

    yy, xx = np.ogrid[y0:y1, x0:x1]
    valid = ellipse_inside(xx, yy, candidate)
    if exclude is not None:
        valid &= ~ellipse_inside(xx, yy, exclude)
    if horizon is not None:
        signed = (
            xx * horizon["normal"][0]
            + yy * horizon["normal"][1]
            + horizon["c"]
        )
        margin = max(
            2.0,
            HORIZON_EXCLUSION_RADIUS * candidate["equivalent_radius"],
        )
        valid &= signed * horizon["visible_sign"] >= margin

    visible_pixels = int(np.count_nonzero(valid))
    if visible_pixels == 0:
        return 0.0, 0
    matching = int(np.count_nonzero(mask[y0:y1, x0:x1][valid]))
    return matching / visible_pixels, visible_pixels
'''
          assert s.count(a)==1, 'visible_fraction anchor'
          s=s.replace(a,b,1)

          a='''    # Seed bins identify the physical boundary that started the growth.  At least
    # one retained component must overlap the seed; other disconnected components
    # may join the same ellipse when they independently have enough support.
    seed_x, seed_y = ellipse_coordinates(ellipse["points"], ellipse)
    seed_theta = np.mod(np.arctan2(seed_y, seed_x), 2.0 * np.pi)
    seed_bins = set(
        np.mod(
            np.rint(seed_theta / (2.0 * np.pi) * ARC_GROW_SAMPLES).astype(np.int32),
            ARC_GROW_SAMPLES,
        ).tolist()
    )

    retained = []
    seed_overlap_any = False
    min_component_bins = max(3, round(ARC_GROW_SAMPLES * 0.01))

    for component in components:
        actual_indices = component[supported[component]]
        if len(actual_indices) < 5:
            continue
        density = len(actual_indices) / len(component)
        if len(component) < min_component_bins and density < 0.8:
            continue
        overlap = sum(int(index) in seed_bins for index in component)
        if overlap:
            seed_overlap_any = True
        retained.append((component, actual_indices, density, overlap))

    if not retained or not seed_overlap_any:
        return None
'''
          b='''    # In horizon mode the original seed can be dominated by the straight
    # clipping edge or by points removed with the dark half-plane.  Filter the
    # seed itself before requiring overlap.  If fewer than five visible seed
    # points survive, strong visible-side components may proceed to the normal
    # final geometry/error/polarity tests without a seed-overlap requirement.
    seed_points = np.asarray(ellipse["points"], np.float64)
    if horizon is not None and len(seed_points):
        seed_margin = max(
            2.0,
            HORIZON_EXCLUSION_RADIUS * ellipse["equivalent_radius"],
        )
        seed_points = seed_points[
            points_on_visible_side(seed_points, horizon, seed_margin)
        ]

    seed_bins = set()
    if len(seed_points):
        seed_x, seed_y = ellipse_coordinates(seed_points, ellipse)
        seed_theta = np.mod(np.arctan2(seed_y, seed_x), 2.0 * np.pi)
        seed_bins = set(
            np.mod(
                np.rint(
                    seed_theta / (2.0 * np.pi) * ARC_GROW_SAMPLES
                ).astype(np.int32),
                ARC_GROW_SAMPLES,
            ).tolist()
        )

    require_seed_overlap = horizon is None or len(seed_points) >= 5
    retained = []
    seed_overlap_any = False
    min_component_bins = max(3, round(ARC_GROW_SAMPLES * 0.01))

    for component in components:
        actual_indices = component[supported[component]]
        if len(actual_indices) < 5:
            continue
        density = len(actual_indices) / len(component)
        if len(component) < min_component_bins and density < 0.8:
            continue
        overlap = sum(int(index) in seed_bins for index in actual_indices)
        if overlap:
            seed_overlap_any = True
        retained.append((component, actual_indices, density, overlap))

    if not retained or (require_seed_overlap and not seed_overlap_any):
        return None
'''
          assert s.count(a)==1, 'seed overlap anchor'
          s=s.replace(a,b,1)

          a='''    segments = []
    all_points = []
    total_bins = 0
    largest_bins = 0
    support_count = 0
    for component, actual_indices, density, overlap in retained:
        segment_points = np.column_stack(
            (found_x[actual_indices], found_y[actual_indices])
        ).astype(np.float64)
        segments.append(segment_points)
        all_points.append(segment_points)
        total_bins += len(component)
        largest_bins = max(largest_bins, len(component))
        support_count += len(actual_indices)

    return {
        "points": np.vstack(all_points),
        "arc_segments": segments,
        "coverage": total_bins / ARC_GROW_SAMPLES,
        "total_supported_coverage": total_bins / ARC_GROW_SAMPLES,
        "largest_segment_coverage": largest_bins / ARC_GROW_SAMPLES,
        "segment_count": len(segments),
        "supported_fraction": support_count / max(total_bins, 1),
        "support_count": int(support_count),
    }
'''
          b='''    segments = []
    all_points = []
    supported_bins = 0
    grouped_bins = 0
    largest_supported_bins = 0
    support_count = 0
    for component, actual_indices, density, overlap in retained:
        segment_points = np.column_stack(
            (found_x[actual_indices], found_y[actual_indices])
        ).astype(np.float64)
        segments.append(segment_points)
        all_points.append(segment_points)
        actual_count = len(actual_indices)
        supported_bins += actual_count
        grouped_bins += len(component)
        largest_supported_bins = max(largest_supported_bins, actual_count)
        support_count += actual_count

    return {
        "points": np.vstack(all_points),
        "arc_segments": segments,
        "coverage": supported_bins / ARC_GROW_SAMPLES,
        "total_supported_coverage": supported_bins / ARC_GROW_SAMPLES,
        "largest_segment_coverage": largest_supported_bins / ARC_GROW_SAMPLES,
        "segment_count": len(segments),
        "supported_fraction": support_count / max(grouped_bins, 1),
        "support_count": int(support_count),
    }
'''
          assert s.count(a)==1, 'coverage anchor'
          s=s.replace(a,b,1)

          a='''    fallback = None
    if (
        axes_in_range(seed, min_radius, max_radius)
        and seed.get("relative_error", math.inf) <= max_error
        and seed.get("coverage", 0.0) >= min_coverage
    ):
        fallback = seed.copy()
        fallback.setdefault("arc_segments", [np.asarray(seed["points"], np.float64)])
        fallback.setdefault("total_supported_coverage", fallback["coverage"])
        fallback.setdefault("largest_segment_coverage", fallback["coverage"])
        fallback.setdefault("segment_count", 1)
        fallback.setdefault("supported_fraction", 1.0)
        fallback.setdefault("support_count", len(fallback["points"]))
        if horizon is not None:
            margin = max(2.0, HORIZON_EXCLUSION_RADIUS * fallback["equivalent_radius"])
            if not np.all(points_on_visible_side(fallback["points"], horizon, margin)):
                fallback = None
'''
          b='''    fallback = None
    if (
        horizon is None
        and axes_in_range(seed, min_radius, max_radius)
        and seed.get("relative_error", math.inf) <= max_error
        and seed.get("coverage", 0.0) >= min_coverage
    ):
        # Horizon mode deliberately has no raw-seed fallback.  Every accepted
        # horizon-clipped candidate must be rebuilt from visible-side support.
        fallback = seed.copy()
        fallback.setdefault("arc_segments", [np.asarray(seed["points"], np.float64)])
        fallback.setdefault("total_supported_coverage", fallback["coverage"])
        fallback.setdefault("largest_segment_coverage", fallback["coverage"])
        fallback.setdefault("segment_count", 1)
        fallback.setdefault("supported_fraction", 1.0)
        fallback.setdefault("support_count", len(fallback["points"]))
'''
          assert s.count(a)==1, 'fallback anchor'
          s=s.replace(a,b,1)

          a='''            fraction, visible_pixels = visible_fraction(light_mask, candidate, dark)
'''
          b='''            fraction, visible_pixels = visible_fraction(
                light_mask,
                candidate,
                dark,
                horizon=horizon,
            )
'''
          assert s.count(a)==1, 'visible fraction call anchor'
          s=s.replace(a,b,1)

          p.write_text(s)
          PY
          python -m py_compile circle_arc_detector.py
          rm -rf __pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle_arc_detector.py
          git rm -r --ignore-unmatch __pycache__
          git commit -m 'Fix horizon half-plane arc support'
          git push origin HEAD:debug/preview-horizon-multiarc
