name: Apply tested threshold selector repair

on:
  push:
    branches:
      - refactor/cleanup-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cleanup-performance
          fetch-depth: 0
      - name: Apply exact locally tested patch
        run: |
          git apply --check .chatgpt_threshold_repair.patch
          git apply .chatgpt_threshold_repair.patch
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "d22970b30bd5292a4791afed4903ebb88c329342"
      - name: Commit repaired detector and remove transport files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circle_arc_detector.py
          git rm .chatgpt_threshold_repair.patch .github/workflows/chatgpt-threshold-repair.yml
          git commit -m "Restore tested sequential threshold selector"
          git push origin HEAD:refactor/cleanup-performance
