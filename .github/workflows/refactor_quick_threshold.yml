# second push intentionally triggers this already-installed workflow
name: Refactor quick threshold selection
on:
  push:
    branches:
      - debug/preview-horizon-multiarc
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Replace detector-based auto threshold with quick estimate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('circle_arc_detector.py')
          text = path.read_text()

          old_comment = '''# Reduced-resolution working sizes.  Auto-threshold selection uses an even
# smaller image because it may evaluate several candidate thresholds.
PREVIEW_MAX_DIM = 2400
AUTO_THRESHOLD_MAX_DIM = 600
'''
          new_comment = '''# Reduced-resolution working sizes.  Automatic threshold initialization uses a
# very small image because it needs only brightness/color statistics; it never
# runs contour, ellipse, arc, or horizon detection.
PREVIEW_MAX_DIM = 2400
AUTO_THRESHOLD_MAX_DIM = 600
'''
          if old_comment not in text:
              raise SystemExit('auto-threshold size comment anchor not found')
          text = text.replace(old_comment, new_comment, 1)

          start = text.index('def score_detection_for_threshold(')
          end = text.index('# ---------------------------------------------------------------------------\n# Tkinter UI', start)
          replacement = '''def auto_select_threshold(color_image, fallback_threshold):
    """Return a quick orientative per-image threshold estimate.

    Automatic initialization is intentionally cheap.  It downsizes the image,
    derives warm/bright solar evidence plus local grayscale/Otsu hints, and uses
    the lowest credible adaptive hint as a conservative starting threshold.

    Crucially, this function performs NO contour search, ellipse fitting, arc
    recovery, horizon detection, morphology, or multi-threshold scoring.  The
    normal Refresh Preview pass is the first real detector run, and the threshold
    remains explicitly editable/stored per image for manual fine tuning.
    """
    fallback = int(np.clip(fallback_threshold, 0, 255))
    if color_image is None or color_image.size == 0:
        return fallback

    working, _ = resize_for_detection(color_image, AUTO_THRESHOLD_MAX_DIM)
    solar_hint = adaptive_solar_hint(working)
    hints = sorted({
        int(np.clip(value, 0, 255))
        for value in solar_hint.get("threshold_hints", [])
        if 0 < int(value) < 255
    })

    # The lowest credible adaptive hint proved to be the most useful general
    # orientation across partial eclipse, totality and full-Sun frames.  It is a
    # starting point only; difficult sunset frames can still need manual movement
    # by a few or many grayscale levels.
    return int(hints[0]) if hints else fallback


'''
          text = text[:start] + replacement + text[end:]

          old_call = '''        threshold = auto_select_threshold(
            self.color_image,
            defaults["threshold"],
            defaults["min_radius"],
            defaults["max_radius"],
            defaults["max_error"],
            defaults["min_coverage"],
            self.args.max_contours,
            self.args.max_search_points,
            palette_size=self.args.palette_size,
        )
'''
          new_call = '''        threshold = auto_select_threshold(
            self.color_image,
            defaults["threshold"],
        )
'''
          if old_call not in text:
              raise SystemExit('auto_select_threshold call anchor not found')
          text = text.replace(old_call, new_call, 1)
          text = text.replace(
              'self.status.set("Analyzing image to choose an initial threshold...")',
              'self.status.set("Estimating a quick initial threshold...")',
              1,
          )

          path.write_text(text)
          PY
          python -m py_compile circle_arc_detector.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('circle_arc_detector.py').read_text())
          funcs = {n.name: n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          auto = funcs['auto_select_threshold']
          called = {
              n.func.id for n in ast.walk(auto)
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
          }
          forbidden = {'detect', 'process_working_image', 'find_candidates', 'grow_candidate'}
          overlap = called & forbidden
          if overlap:
              raise SystemExit(f'auto threshold still invokes detector functions: {sorted(overlap)}')
          if 'score_detection_for_threshold' in funcs:
              raise SystemExit('obsolete detector-based threshold scorer still present')
          print('quick auto-threshold AST check passed')
          PY
          rm -rf .export
          rm -f .trigger_export_chunks .trigger_export_small_chunks
          rm -f .github/workflows/export_chunks.yml
          rm -f .github/workflows/refactor_quick_threshold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make automatic threshold selection instantaneous'
          git push origin HEAD:debug/preview-horizon-multiarc
