name: Apply full-chord horizon debug patch

on:
  push:
    branches:
      - debug/preview-horizon-multiarc
    paths:
      - .trigger_full_chord

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
          fetch-depth: 0

      - name: Apply tested horizon patch
        run: |
          git apply .debug_horizon_full_chord.patch
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "2c84e894aa2c933b89e53e5e4884eec33ee07cbd"
          ! grep -q 'HORIZON_MIN_SPAN_RADIUS' circle_arc_detector.py

      - name: Remove debug staging debris
        run: |
          rm -f .debug_horizon_full_chord.patch .debug_source.b64
          rm -f .trigger_anchor_report .trigger_horizon_fix .trigger_horizon_logic2 .trigger_full_chord
          rm -rf __pycache__
          rm -f .github/workflows/apply_horizon_logic_only.yml
          rm -f .github/workflows/export_debug_detector.yml
          rm -f .github/workflows/fix_horizon_support.yml
          rm -f .github/workflows/materialize_debug_source.yml
          rm -f .github/workflows/report_horizon_anchors.yml
          rm -f .github/workflows/apply_full_chord.yml

      - name: Commit debug checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate horizon across full solar chord"
          git push origin HEAD:debug/preview-horizon-multiarc
