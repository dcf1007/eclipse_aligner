name: Validate unified SolarData preview flow

on:
  push:
    branches:
      - rebuild/threshold_finder
    paths:
      - snippets/apply_unified_solar_data_preview_flow.py
      - snippets/inline_auto_threshold_separated_component.py
      - tests/test_gui_threshold_integration.py
      - tests/test_solar_data_persistence.py
      - tests/test_solar_mask_refinement_integration.py
      - .github/workflows/validate-unified-solar-data-preview.yml

permissions:
  contents: write

jobs:
  validate-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/threshold_finder

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest

      - name: Apply preserved implementation
        run: |
          python snippets/apply_unified_solar_data_preview_flow.py
          python snippets/inline_auto_threshold_separated_component.py

      - name: Verify source structure
        run: |
          python -m py_compile circle_arc_detector.py
          python -m py_compile snippets/apply_unified_solar_data_preview_flow.py
          python -m py_compile snippets/inline_auto_threshold_separated_component.py
          git diff --check
          grep -q 'def build_solar_data_at_threshold(' circle_arc_detector.py
          grep -q 'def display_on_canvas(' circle_arc_detector.py
          grep -q 'image_state\["solar_data"\] = solar_data' circle_arc_detector.py
          grep -q 'self.root.update_idletasks()' circle_arc_detector.py
          grep -q 'separated_binary = cv2.compare' circle_arc_detector.py
          ! grep -q 'def solar_component_from_seed_at_threshold(' circle_arc_detector.py
          ! grep -q 'def establish_solar_component_at_threshold(' circle_arc_detector.py
          ! grep -q 'def build_solar_data(' circle_arc_detector.py
          ! grep -q 'def _refresh_threshold_image(' circle_arc_detector.py
          ! grep -q 'def _ensure_solar_data_for_current_threshold(' circle_arc_detector.py
          ! grep -q 'def _show_image_on_canvas(' circle_arc_detector.py

      - name: Run combined regression
        run: >-
          python -m pytest -q
          tests/test_threshold_finder.py
          tests/test_topology_threshold_optimizer.py
          tests/test_threshold_topology_integration.py
          tests/test_gui_threshold_integration.py
          tests/test_threshold_gui_deferred_preview_refresh.py
          tests/test_solar_data_persistence.py
          tests/test_refine_solar_component_mask.py
          tests/test_solar_mask_refinement_integration.py

      - name: Show validated production diff
        run: |
          git diff --stat -- circle_arc_detector.py
          git diff --check -- circle_arc_detector.py
          git diff -- circle_arc_detector.py

      - name: Commit validated production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circle_arc_detector.py
          git commit -m "Unify SolarData threshold preview flow"
          git push origin HEAD:rebuild/threshold_finder
