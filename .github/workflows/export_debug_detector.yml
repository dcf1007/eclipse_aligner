name: Export debug detector

on:
  push:
    branches:
      - debug/preview-horizon-multiarc

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: debug-detector-source
          path: circle_arc_detector.py
          if-no-files-found: error
