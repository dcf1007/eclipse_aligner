name: Assemble WIP detector

on:
  push:
    branches:
      - debug/preview-horizon-multiarc
    paths:
      - .github/workflows/assemble-wip.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
          fetch-depth: 0

      - name: Reconstruct and verify WIP source
        shell: bash
        run: |
          cat .wip/part* | base64 --decode | gzip --decompress > circle_arc_detector.py
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "69042c83011ff6dc0102e1ec76ffdd401880b6a7"

      - name: Commit exact WIP source and remove staging files
        shell: bash
        run: |
          rm -rf .wip .github/workflows/assemble-wip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage WIP preview/horizon detector"
          git push origin HEAD:debug/preview-horizon-multiarc
