name: Apply ChatGPT staged patch

on:
  push:
    branches:
      - refactor/cleanup-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cleanup-performance
          fetch-depth: 0
      - name: Apply and validate patch
        run: |
          git apply --check .chatgpt_change.patch
          git apply .chatgpt_change.patch
          python -m py_compile circle_arc_detector.py
      - name: Commit tested source and remove transport files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circle_arc_detector.py
          git rm .chatgpt_change.patch .github/workflows/chatgpt-apply.yml
          git commit -m "Use rounded solar component ROIs for candidate discovery"
          git push origin HEAD:refactor/cleanup-performance
