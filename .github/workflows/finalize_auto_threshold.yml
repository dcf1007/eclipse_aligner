name: Finalize automatic threshold selector
on:
  push:
    branches:
      - debug/preview-horizon-multiarc
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Patch and verify
        run: |
          python .patch_selector.py
          python -m py_compile circle_arc_detector.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('circle_arc_detector.py').read_text())
          names = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.ClassDef))}
          required = {'auto_select_threshold', 'detect', 'DetectorApp'}
          missing = required - names
          if missing:
              raise SystemExit(f'missing: {sorted(missing)}')
          PY
          rm -f .patch_selector.py
          rm -f .debug_source_export.txt
          rm -f .trigger_*
          rm -rf __pycache__
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize adaptive per-image threshold selection'
          git push origin HEAD:debug/preview-horizon-multiarc
