name: Materialize debug source

on:
  push:
    branches:
      - debug/preview-horizon-multiarc

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Encode detector source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, textwrap
          data = Path('circle_arc_detector.py').read_bytes()
          encoded = base64.b64encode(gzip.compress(data, 9)).decode('ascii')
          Path('.debug_source.b64').write_text('\n'.join(textwrap.wrap(encoded, 120)) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .debug_source.b64
          git commit -m 'Materialize debug detector source' || exit 0
          git push origin HEAD:debug/preview-horizon-multiarc
