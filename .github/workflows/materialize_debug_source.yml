name: Materialize and patch debug source

on:
  push:
    branches:
      - debug/preview-horizon-multiarc

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply horizon support fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('circle_arc_detector.py')
          source = path.read_text(encoding='utf-8')

          def replace_function(text, name, next_anchor, replacement):
              start = text.index(f'def {name}(')
              end = text.index(next_anchor, start)
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          visible_fraction = r'''def visible_fraction(mask, candidate, exclude=None, horizon=None):
    """Measure mask occupancy only in the physically visible candidate area.

    If a horizon is known, the occluded half-plane and a narrow exclusion strip
    around the straight edge are removed from the denominator.  This keeps the
    user's physical rule explicit: the horizon-dark side is not missing light
    evidence; it is outside the visible solar region altogether.
    """
    height, width = mask.shape
    x0, y0, x1, y1 = ellipse_bounds(candidate, width, height)
    if x0 >= x1 or y0 >= y1:
        return 0.0, 0

    yy, xx = np.ogrid[y0:y1, x0:x1]
    valid = ellipse_inside(xx, yy, candidate)
    if exclude is not None:
        valid &= ~ellipse_inside(xx, yy, exclude)

    if horizon is not None:
        signed = (
            xx * horizon["normal"][0]
            + yy * horizon["normal"][1]
            + horizon["c"]
        )
        margin = max(
            2.0,
            HORIZON_EXCLUSION_RADIUS * candidate["equivalent_radius"],
        )
        valid &= signed * horizon["visible_sign"] >= margin

    visible_pixels = int(np.count_nonzero(valid))
    if visible_pixels == 0:
        return 0.0, 0
    matching = int(np.count_nonzero(mask[y0:y1, x0:x1][valid]))
    return matching / visible_pixels, visible_pixels
'''
          source = replace_function(
              source,
              'visible_fraction',
              '# ---------------------------------------------------------------------------\n# Horizon detection and half-plane constraints',
              visible_fraction,
          )

          grow_arc_support = r'''def grow_arc_support(mask, ellipse, horizon=None):
    """Recover every coherent supported arc segment around a predicted ellipse.

    Tiny angular gaps may be bridged only to decide which samples belong to the
    same component.  Bridged bins never count as observed coverage.  With a
    horizon, support on the dark half-plane and support too close to the straight
    horizon edge are removed before components are built.
    """
    theta = np.linspace(0.0, 2.0 * np.pi, ARC_GROW_SAMPLES, endpoint=False)
    px, py, nx, ny = ellipse_points_and_normals(ellipse, theta)

    search_distance = EDGE_SEARCH_FRACTION * min(ellipse["major"], ellipse["minor"])
    step = max(1.0, search_distance / 90.0)
    offsets = np.arange(
        -search_distance,
        search_distance + 0.5 * step,
        step,
        dtype=np.float32,
    )

    sample_x = np.rint(px[:, None] + nx[:, None] * offsets[None, :]).astype(np.int32)
    sample_y = np.rint(py[:, None] + ny[:, None] * offsets[None, :]).astype(np.int32)
    height, width = mask.shape
    valid = (
        (sample_x >= 0) & (sample_x < width)
        & (sample_y >= 0) & (sample_y < height)
    )

    values = np.zeros(sample_x.shape, np.uint8)
    values[valid] = (mask[sample_y[valid], sample_x[valid]] != 0).astype(np.uint8)
    transitions = (
        (values[:, :-1] == 1)
        & (values[:, 1:] == 0)
        & valid[:, :-1]
        & valid[:, 1:]
    )
    midpoint_offsets = 0.5 * (offsets[:-1] + offsets[1:])
    costs = np.where(transitions, np.abs(midpoint_offsets)[None, :], np.inf)
    best_index = np.argmin(costs, axis=1)
    best_cost = costs[np.arange(ARC_GROW_SAMPLES), best_index]
    supported = np.isfinite(best_cost)
    if not np.any(supported):
        return None

    found_offset = midpoint_offsets[best_index]
    found_x = px + nx * found_offset
    found_y = py + ny * found_offset

    if horizon is not None:
        points = np.column_stack((found_x, found_y))
        margin = max(
            2.0,
            HORIZON_EXCLUSION_RADIUS * ellipse["equivalent_radius"],
        )
        supported &= points_on_visible_side(points, horizon, margin)
        if not np.any(supported):
            return None

    max_gap = max(1, round(ARC_GROW_SAMPLES * 0.008))
    grouped = bridge_small_gaps(supported, max_gap)
    components = circular_components(grouped)
    if not components:
        return None

    # Seed overlap normally protects against jumping to an unrelated edge.  In
    # horizon mode, first discard seed points that lie on/behind the horizon.  A
    # horizon-dominated seed can legitimately leave fewer than five such points;
    # in that special case, do not require seed-bin overlap, because all recovered
    # samples are already constrained to the predicted ellipse and visible side
    # and still have to pass strict final geometry/error/polarity validation.
    seed_points = np.asarray(ellipse["points"], np.float64)
    if horizon is not None and len(seed_points):
        seed_margin = max(
            2.0,
            HORIZON_EXCLUSION_RADIUS * ellipse["equivalent_radius"],
        )
        seed_points = seed_points[
            points_on_visible_side(seed_points, horizon, seed_margin)
        ]

    seed_bins = set()
    if len(seed_points):
        seed_x, seed_y = ellipse_coordinates(seed_points, ellipse)
        seed_theta = np.mod(np.arctan2(seed_y, seed_x), 2.0 * np.pi)
        seed_bins = set(
            np.mod(
                np.rint(
                    seed_theta / (2.0 * np.pi) * ARC_GROW_SAMPLES
                ).astype(np.int32),
                ARC_GROW_SAMPLES,
            ).tolist()
        )

    require_seed_overlap = horizon is None or len(seed_points) >= 5
    retained = []
    seed_overlap_any = False
    min_component_bins = max(3, round(ARC_GROW_SAMPLES * 0.01))

    for component in components:
        actual_indices = component[supported[component]]
        if len(actual_indices) < 5:
            continue
        density = len(actual_indices) / max(len(component), 1)
        if len(component) < min_component_bins and density < 0.8:
            continue

        overlap = sum(int(index) in seed_bins for index in actual_indices)
        if overlap:
            seed_overlap_any = True
        retained.append((component, actual_indices, density, overlap))

    if not retained or (require_seed_overlap and not seed_overlap_any):
        return None

    segments = []
    all_points = []
    supported_bins = 0
    grouped_bins = 0
    largest_supported_bins = 0

    for component, actual_indices, density, overlap in retained:
        segment_points = np.column_stack(
            (found_x[actual_indices], found_y[actual_indices])
        ).astype(np.float64)
        segments.append(segment_points)
        all_points.append(segment_points)

        actual_count = len(actual_indices)
        supported_bins += actual_count
        grouped_bins += len(component)
        largest_supported_bins = max(largest_supported_bins, actual_count)

    return {
        "points": np.vstack(all_points),
        "arc_segments": segments,
        "coverage": supported_bins / ARC_GROW_SAMPLES,
        "total_supported_coverage": supported_bins / ARC_GROW_SAMPLES,
        "largest_segment_coverage": largest_supported_bins / ARC_GROW_SAMPLES,
        "segment_count": len(segments),
        "supported_fraction": supported_bins / max(grouped_bins, 1),
        "support_count": int(supported_bins),
    }
'''
          source = replace_function(
              source,
              'grow_arc_support',
              'def growth_compatible(',
              grow_arc_support,
          )

          grow_candidate = r'''def grow_candidate(mask, seed, min_radius, max_radius, max_error,
                   min_coverage, horizon=None):
    # Preserve the established non-horizon short-arc fallback for regression
    # stability.  Horizon mode deliberately has no raw-seed fallback: every
    # accepted candidate must be rebuilt from support explicitly recovered on the
    # visible half-plane.
    fallback = None
    if (
        horizon is None
        and axes_in_range(seed, min_radius, max_radius)
        and seed.get("relative_error", math.inf) <= max_error
        and seed.get("coverage", 0.0) >= min_coverage
    ):
        fallback = seed.copy()
        fallback.setdefault(
            "arc_segments",
            [np.asarray(seed["points"], np.float64)],
        )
        fallback.setdefault("total_supported_coverage", fallback["coverage"])
        fallback.setdefault("largest_segment_coverage", fallback["coverage"])
        fallback.setdefault("segment_count", 1)
        fallback.setdefault("supported_fraction", 1.0)
        fallback.setdefault("support_count", len(fallback["points"]))

    support = grow_arc_support(mask, seed, horizon=horizon)
    if support is None:
        return fallback

    best = None
    for ellipse in fit_ellipse_options(support["points"]):
        if not axes_in_range(ellipse, min_radius, max_radius):
            continue

        relative_error, _ = ellipse_error_and_coverage(support["points"], ellipse)
        if relative_error > max_error:
            continue

        candidate = {
            **ellipse,
            **support,
            "relative_error": relative_error,
            "start": seed.get("start", 0),
            "length": support["support_count"],
        }

        # Final-range seeds should not drift far.  Deliberately relaxed
        # intermediate seeds may move substantially as additional real support
        # constrains them, but final axis/error/polarity limits remain mandatory.
        if axes_in_range(seed, min_radius, max_radius):
            if not growth_compatible(seed, candidate):
                continue

        if horizon is not None:
            margin = max(
                2.0,
                HORIZON_EXCLUSION_RADIUS * candidate["equivalent_radius"],
            )
            if not np.all(
                points_on_visible_side(candidate["points"], horizon, margin)
            ):
                continue

        polarity, inside_fraction, sample_count = boundary_polarity(mask, candidate)
        if sample_count < 5 or polarity < MIN_BOUNDARY_POLARITY:
            continue

        candidate["boundary_polarity"] = polarity
        candidate["interior_fraction"] = inside_fraction
        candidate["score"] = (
            candidate["coverage"]
            * (0.65 + 0.35 * candidate["supported_fraction"])
            * (0.65 + 0.35 * polarity)
            / (1.0 + 4.0 * relative_error)
        )
        if candidate["coverage"] < min_coverage:
            continue

        if best is None or (
            candidate["coverage"],
            candidate["largest_segment_coverage"],
            candidate["score"],
            candidate["support_count"],
        ) > (
            best["coverage"],
            best["largest_segment_coverage"],
            best["score"],
            best["support_count"],
        ):
            best = candidate

    return best if best is not None else fallback
'''
          source = replace_function(
              source,
              'grow_candidate',
              'def prepare_candidates(',
              grow_candidate,
          )

          old = '            fraction, visible_pixels = visible_fraction(light_mask, candidate, dark)\n'
          new = '''            fraction, visible_pixels = visible_fraction(\n                light_mask,\n                candidate,\n                dark,\n                horizon=horizon,\n            )\n'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'horizon=horizon' not in source[source.index('def detect('):source.index('# ---------------------------------------------------------------------------\n# Rendering and scale conversion')]:
              raise SystemExit('visible_fraction detect call not found')

          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile circle_arc_detector.py

      - name: Materialize exact source
        shell: bash
        run: |
          rm -rf .debug_parts
          mkdir .debug_parts
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, textwrap

          data = Path('circle_arc_detector.py').read_bytes()
          encoded = base64.b64encode(gzip.compress(data, 9)).decode('ascii')
          Path('.debug_source.b64').write_text(
              '\n'.join(textwrap.wrap(encoded, 120)) + '\n'
          )
          part_size = 4000
          parts = [
              encoded[i:i + part_size]
              for i in range(0, len(encoded), part_size)
          ]
          for index, part in enumerate(parts):
              Path(f'.debug_parts/part{index:03d}.txt').write_text(part)
          Path('.debug_parts/count.txt').write_text(str(len(parts)))
          PY

      - name: Commit staged detector
        shell: bash
        run: |
          rm -rf __pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle_arc_detector.py .debug_source.b64 .debug_parts
          git rm -r --ignore-unmatch __pycache__
          git commit -m 'Fix horizon-clipped multi-arc support'
          git push origin HEAD:debug/preview-horizon-multiarc
