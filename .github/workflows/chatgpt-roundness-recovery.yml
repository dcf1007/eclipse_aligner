name: Apply recovered roundness regularizer

on:
  push:
    branches:
      - refactor/cleanup-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cleanup-performance
          fetch-depth: 0
      - name: Apply exact recovered roundness patch
        run: |
          base64 -d .chatgpt_roundness_recovery.patch.gz.b64 | gzip -d > /tmp/roundness.patch
          git apply --check /tmp/roundness.patch
          git apply /tmp/roundness.patch
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "82d33d9d6954df0f96c8a6bcc8e2bc2c8edc91d7"
      - name: Commit recovered detector and remove transport files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circle_arc_detector.py
          git rm .chatgpt_roundness_recovery.patch.gz.b64 .github/workflows/chatgpt-roundness-recovery.yml
          git commit -m "Restore tested final roundness regularizer"
          git push origin HEAD:refactor/cleanup-performance
