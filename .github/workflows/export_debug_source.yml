name: Export debug source
on:
  push:
    branches:
      - debug/preview-horizon-multiarc
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Export compressed source
        run: |
          gzip -c circle_arc_detector.py | base64 -w 0 > .debug_source_export.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .debug_source_export.txt
          git commit -m 'Export debug detector source' || exit 0
          git push origin HEAD:debug/preview-horizon-multiarc
