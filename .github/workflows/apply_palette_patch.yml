name: Checkpoint horizon-first detector

on:
  push:
    branches:
      - debug/preview-horizon-multiarc
    paths:
      - .horizon_checkpoint_trigger

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Apply verified local checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .horizon_patch_part* > .horizon_rework.patch
          git apply --check .horizon_rework.patch
          git apply .horizon_rework.patch
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "d89aeb894792f90f9e9860f759333209403dc0c1"
          rm -f .horizon_patch_part* .horizon_rework.patch .horizon_checkpoint_trigger .palette.patch
          rm -f .github/workflows/apply_palette_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Checkpoint horizon-first detection rework"
          git push origin HEAD:debug/preview-horizon-multiarc
