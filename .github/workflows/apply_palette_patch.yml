name: Export debug detector source
on:
  push:
    branches:
      - debug/preview-horizon-multiarc
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Verify source
        run: python -m py_compile circle_arc_detector.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug-detector-source
          path: circle_arc_detector.py
          if-no-files-found: error
