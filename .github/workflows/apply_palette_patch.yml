# trigger installed workflow
name: Apply threshold palette patch
on:
  push:
    branches:
      - debug/preview-horizon-multiarc
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/preview-horizon-multiarc
      - name: Apply and verify
        run: |
          git apply .palette.patch
          python -m py_compile circle_arc_detector.py
          test "$(git hash-object circle_arc_detector.py)" = "3b428c4e0126068c2d099d732def707cfd709b44"
          rm -rf .github __pycache__
          rm -f .palette.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep useful manual threshold neighbors visible'
          git push origin HEAD:debug/preview-horizon-multiarc
